
default:

  debug_mode: False

  app:
    name: "Outlook"
    description: "Microsoft Outlook is an email and calendar app that lets users read and send mail, manage calendars, contacts, and notifications."

  driver:
    device_id: "3AP0224B05003112"
    os_name: "harmony"
    appPackage: "com.microsoft.office.outlook"
